name: CI

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

concurrency:
  # Stable builds are never cancelled; superseded development and PR checks may be cancelled.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/development' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up build tools
        uses: ./.github/actions/setup-build-tools
        with:
          rust-components: rustfmt, clippy
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify clean-install native SQLite
        run: node scripts/verify-install.mjs
      - name: Recorded CLI compatibility (no paid calls)
        run: pnpm exec vitest run apps/api/src/harness/compatibility.test.ts
      - name: Build process engine
        run: pnpm engine:build
      - name: Check and test Rust
        run: pnpm engine:check && pnpm engine:test
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Lint
        run: pnpm lint
      - name: Test release packaging
        run: pnpm release:test
      - name: Test server deployment policy
        run: python3 -m unittest discover -s scripts/server -p 'test_*.py'
      - name: Typecheck
        run: pnpm typecheck
      - name: QA gate
        run: pnpm test:qa
      - name: Package versioned release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: package
        run: pnpm release:package
      - name: Upload release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: output/releases/
          if-no-files-found: error
          compression-level: 0
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  desktop:
    name: Linux desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up build tools
        uses: ./.github/actions/setup-build-tools
        with:
          desktop: 'true'
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb dbus-x11 poppler-utils
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check native code
        run: pnpm desktop:check
      - name: Native race and contract tests
        run: pnpm desktop:test
      - name: Build packaged executable
        run: pnpm desktop:build
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Existing database and packaged MCP integration
        run: pnpm desktop:integration
      - name: Browser feature parity against Go API
        env:
          OPSIS_QA_DESKTOP_BINARY: output/desktop/opsis
        run: pnpm test:browser
      - name: Hidden WebKit, React and WASM smoke
        run: |
          profile=$(mktemp -d)
          trap 'rm -rf "$profile"' EXIT
          xvfb-run -a env GDK_BACKEND=x11 OPSIS_DATA_DIR="$profile" OPSIS_SPEECH=off ./output/desktop/opsis --smoke-test
      - name: Package desktop release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm desktop:package
      - name: Upload desktop release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release
          path: output/desktop-release/
          if-no-files-found: error
          compression-level: 0
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-browser-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  windows-desktop:
    name: Windows desktop
    runs-on: windows-2025
    env:
      CGO_ENABLED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up build tools
        uses: ./.github/actions/setup-build-tools
        with:
          desktop: 'true'
      # cgo (SQLite and the race detector) needs a MinGW-w64 gcc.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add MinGW gcc to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
      - name: Ensure WebView2 runtime
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $key) { "WebView2 $((Get-ItemProperty $key).pv)"; exit 0 }
          Invoke-WebRequest https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile webview2.exe
          Start-Process .\webview2.exe -ArgumentList '/silent','/install' -Wait
      # pnpm's bundled node-gyp predates the runner's Visual Studio 2026 (v18).
      - name: Use a node-gyp that supports the runner's Visual Studio
        shell: pwsh
        run: |
          npm install --global node-gyp@13.1.0
          Add-Content $env:GITHUB_ENV "npm_config_node_gyp=$(npm root --global)\node-gyp\bin\node-gyp.js"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check native code
        run: pnpm desktop:check
      - name: Native race and contract tests
        run: pnpm desktop:test
      - name: Build packaged executable
        run: pnpm desktop:build
      - name: Install browser
        run: pnpm exec playwright install chromium
      - name: Existing database and packaged MCP integration
        env:
          OPSIS_QA_DESKTOP_BINARY: output/desktop/opsis.exe
        run: pnpm desktop:integration
      - name: Browser feature parity against Go API
        env:
          OPSIS_QA_DESKTOP_BINARY: output/desktop/opsis.exe
        run: pnpm test:browser
      - name: Hidden WebView2, React and WASM smoke
        run: |
          profile=$(mktemp -d)
          trap 'rm -rf "$profile"' EXIT
          OPSIS_DATA_DIR="$(cygpath -w "$profile")" OPSIS_SPEECH=off ./output/desktop/opsis.exe --smoke-test
      - name: Install Inno Setup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      # Signing switches on when WINDOWS_CERTIFICATE secrets exist. Only main builds get
      # a signed update manifest, so installed apps update to main and nothing else.
      - name: Package desktop release and installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          OPSIS_UPDATE_SIGNING_KEY: ${{ github.ref == 'refs/heads/main' && secrets.OPSIS_UPDATE_SIGNING_KEY || '' }}
        run: pnpm desktop:package
      - name: Upload desktop release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-release
          path: output/desktop-release/
          if-no-files-found: error
          compression-level: 0
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-browser-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  macos-desktop:
    name: macOS desktop (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '1'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      OPSIS_QA_DESKTOP_BINARY: output/desktop/Opsis.app/Contents/MacOS/opsis
    steps:
      - uses: actions/checkout@v4
      - name: Set up build tools
        uses: ./.github/actions/setup-build-tools
        with:
          desktop: 'true'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check native code
        run: pnpm desktop:check
      - name: Native race and contract tests
        run: pnpm desktop:test
      - name: Build application bundle
        run: pnpm desktop:build
      - name: Install browser
        run: pnpm exec playwright install chromium
      - name: Existing database and packaged MCP integration
        run: pnpm desktop:integration
      - name: Browser feature parity against Go API
        run: pnpm test:browser
      - name: Hidden WKWebView, React and WASM smoke
        run: |
          profile=$(mktemp -d)
          trap 'rm -rf "$profile"' EXIT
          OPSIS_DATA_DIR="$profile" OPSIS_SPEECH=off "$OPSIS_QA_DESKTOP_BINARY" --smoke-test
      - name: Package desktop release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm desktop:package
      - name: Verify packaged application
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          ditto -x -k output/desktop-release/*.zip "$stage"
          app=$(find "$stage" -name Opsis.app -type d -maxdepth 2)
          codesign --verify --strict "$app"
          OPSIS_DATA_DIR="$stage/profile" OPSIS_SPEECH=off "$app/Contents/MacOS/opsis" --diagnose
      - name: Upload desktop release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-desktop-release
          path: output/desktop-release/
          if-no-files-found: error
          compression-level: 0
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-browser-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  release:
    name: Publish desktop and developer prerelease
    needs: [check, desktop, windows-desktop, macos-desktop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: windows-desktop-release
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*-desktop-release
          merge-multiple: true
          path: release
      - name: Publish release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "Release already published: $RELEASE_TAG"
            exit 0
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$RELEASE_COMMIT" \
              --title "Opsis $RELEASE_VERSION" \
              --draft --prerelease --latest=false --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false

  release-retention:
    name: Keep the 5 newest releases
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release-retention.yml
    with:
      keep: 5
