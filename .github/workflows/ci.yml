name: CI

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

concurrency:
  # Stable builds are never cancelled; superseded development and PR checks may be cancelled.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/development' }}

jobs:
  # A main push whose exact files already passed a development push run is not tested
  # again: its jobs only build, package and publish. Promotion PRs must be up to date with
  # main, so a merge commit has the same tree as the development commit that passed.
  # Without such a run (a direct fix, a cancelled run), main runs every check as before.
  tested:
    name: Find the passing development run
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - name: Match this commit's files to a passing development run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Any lookup that fails leaves no match, so main falls back to every check.
          tree=$(gh api "repos/$GH_REPO/commits/$SHA" --jq .commit.tree.sha) || tree=''
          runs=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=development&event=push&status=success&per_page=30" \
            --jq '.workflow_runs[] | "\(.id) \(.head_sha)"') || runs=''
          while read -r id head; do
            [[ "$tree" =~ ^[0-9a-f]{40}$ && "$id" =~ ^[0-9]+$ ]] || continue
            tested=$(gh api "repos/$GH_REPO/commits/$head" --jq .commit.tree.sha) || continue
            if [ "$tested" = "$tree" ]; then
              echo "Development run $id passed every check on $head, which has this commit's files."
              echo "run=$id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done <<< "$runs"
          echo "No passing development run has these exact files; running every check."

  check:
    runs-on: ubuntu-latest
    needs: tested
    # A promotion PR's head is development's tip, already checked by its push run.
    if: ${{ !cancelled() && needs.tested.result != 'failure' && (github.event_name != 'pull_request' || github.head_ref != 'development') }}
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up build tools
        uses: ./.github/actions/setup-build-tools
        with:
          rust-components: rustfmt, clippy
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify clean-install native SQLite
        if: needs.tested.outputs.run == ''
        run: node scripts/verify-install.mjs
      - name: Recorded CLI compatibility (no paid calls)
        if: needs.tested.outputs.run == ''
        run: pnpm exec vitest run apps/api/src/harness/compatibility.test.ts
      - name: Build process engine
        run: pnpm engine:build
      - name: Check and test Rust
        if: needs.tested.outputs.run == ''
        run: pnpm engine:check && pnpm engine:test
      - name: Install browser
        if: needs.tested.outputs.run == ''
        run: pnpm exec playwright install --with-deps chromium
      - name: Lint
        if: needs.tested.outputs.run == ''
        run: pnpm lint
      - name: Test release packaging
        if: needs.tested.outputs.run == ''
        run: pnpm release:test
      - name: Test server deployment policy
        if: needs.tested.outputs.run == ''
        run: python3 -m unittest discover -s scripts/server -p 'test_*.py'
      - name: Typecheck
        if: needs.tested.outputs.run == ''
        run: pnpm typecheck
      - name: QA gate
        if: needs.tested.outputs.run == ''
        run: pnpm test:qa
      - name: Build the web release
        if: needs.tested.outputs.run != ''
        run: pnpm build
      - name: Package versioned release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: package
        run: pnpm release:package
      - name: Upload release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: output/releases/
          if-no-files-found: error
          compression-level: 0
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  desktop:
    name: Linux desktop
    needs: tested
    # A promotion PR's head is development's tip, already checked by its push run.
    if: ${{ !cancelled() && needs.tested.result != 'failure' && (github.event_name != 'pull_request' || github.head_ref != 'development') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up build tools
        uses: ./.github/actions/setup-build-tools
        with:
          desktop: 'true'
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb dbus-x11 poppler-utils
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check native code
        if: needs.tested.outputs.run == ''
        run: pnpm desktop:check
      - name: Native race and contract tests
        if: needs.tested.outputs.run == ''
        run: pnpm desktop:test
      - name: Build packaged executable
        uses: ./.github/actions/build-desktop
      - name: Install browser
        if: needs.tested.outputs.run == ''
        run: pnpm exec playwright install --with-deps chromium
      - name: Existing database and packaged MCP integration
        if: needs.tested.outputs.run == ''
        run: pnpm desktop:integration
      - name: Browser feature parity against Go API
        if: needs.tested.outputs.run == ''
        env:
          OPSIS_QA_DESKTOP_BINARY: output/desktop/opsis
        run: pnpm test:browser
      - name: Hidden WebKit, React and WASM smoke
        if: needs.tested.outputs.run == ''
        run: |
          profile=$(mktemp -d)
          trap 'rm -rf "$profile"' EXIT
          xvfb-run -a env GDK_BACKEND=x11 OPSIS_DATA_DIR="$profile" OPSIS_SPEECH=off ./output/desktop/opsis --smoke-test
      - name: Package desktop release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm desktop:package
      - name: Upload desktop release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release
          path: output/desktop-release/
          if-no-files-found: error
          compression-level: 0
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-browser-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  windows-desktop:
    name: Windows desktop
    needs: tested
    # A promotion PR's head is development's tip, already checked by its push run.
    if: ${{ !cancelled() && needs.tested.result != 'failure' && (github.event_name != 'pull_request' || github.head_ref != 'development') }}
    runs-on: windows-2025
    env:
      CGO_ENABLED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up build tools
        uses: ./.github/actions/setup-build-tools
        with:
          desktop: 'true'
      # cgo (SQLite and the race detector) needs a MinGW-w64 gcc.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add MinGW gcc to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
      - name: Ensure WebView2 runtime
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $key) { "WebView2 $((Get-ItemProperty $key).pv)"; exit 0 }
          Invoke-WebRequest https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile webview2.exe
          Start-Process .\webview2.exe -ArgumentList '/silent','/install' -Wait
      # pnpm's bundled node-gyp predates the runner's Visual Studio 2026 (v18).
      - name: Use a node-gyp that supports the runner's Visual Studio
        shell: pwsh
        run: |
          npm install --global node-gyp@13.1.0
          Add-Content $env:GITHUB_ENV "npm_config_node_gyp=$(npm root --global)\node-gyp\bin\node-gyp.js"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check native code
        if: needs.tested.outputs.run == ''
        run: pnpm desktop:check
      - name: Native race and contract tests
        if: needs.tested.outputs.run == ''
        run: pnpm desktop:test
      - name: Build packaged executable
        uses: ./.github/actions/build-desktop
      - name: Install browser
        if: needs.tested.outputs.run == ''
        run: pnpm exec playwright install chromium
      - name: Existing database and packaged MCP integration
        if: needs.tested.outputs.run == ''
        env:
          OPSIS_QA_DESKTOP_BINARY: output/desktop/opsis.exe
        run: pnpm desktop:integration
      - name: Browser feature parity against Go API
        if: needs.tested.outputs.run == ''
        env:
          OPSIS_QA_DESKTOP_BINARY: output/desktop/opsis.exe
        run: pnpm test:browser
      - name: Hidden WebView2, React and WASM smoke
        if: needs.tested.outputs.run == ''
        run: |
          profile=$(mktemp -d)
          trap 'rm -rf "$profile"' EXIT
          OPSIS_DATA_DIR="$(cygpath -w "$profile")" OPSIS_SPEECH=off ./output/desktop/opsis.exe --smoke-test
      - name: Install Inno Setup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      # Signing switches on when WINDOWS_CERTIFICATE secrets exist. Only main builds get
      # a signed update manifest, so installed apps update to main and nothing else.
      - name: Package desktop release and installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          OPSIS_UPDATE_SIGNING_KEY: ${{ github.ref == 'refs/heads/main' && secrets.OPSIS_UPDATE_SIGNING_KEY || '' }}
        run: pnpm desktop:package
      - name: Upload desktop release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-release
          path: output/desktop-release/
          if-no-files-found: error
          compression-level: 0
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-browser-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  macos-native:
    name: macOS native checks (${{ matrix.arch }})
    needs: tested
    if: ${{ !cancelled() && needs.tested.result != 'failure' && needs.tested.outputs.run == '' && (github.event_name != 'pull_request' || github.head_ref != 'development') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '1'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - name: Set up native test tools
        uses: ./.github/actions/setup-build-tools
        with:
          desktop: 'true'
          rust: 'false'
          go-cache-scope: native-checks
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check native code
        run: pnpm desktop:check
      - name: Native race and contract tests
        run: pnpm desktop:test

  macos-build:
    name: macOS build (${{ matrix.arch }})
    needs: tested
    # A promotion PR's head is development's tip, already checked by its push run.
    if: ${{ !cancelled() && needs.tested.result != 'failure' && (github.event_name != 'pull_request' || github.head_ref != 'development') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '1'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      OPSIS_QA_DESKTOP_BINARY: output/desktop/Opsis.app/Contents/MacOS/opsis
    steps:
      - uses: actions/checkout@v4
      - name: Set up build tools
        uses: ./.github/actions/setup-build-tools
        with:
          desktop: 'true'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build application bundle
        uses: ./.github/actions/build-desktop
      - name: Existing database and packaged MCP integration
        if: needs.tested.outputs.run == ''
        run: pnpm desktop:integration
      - name: Hidden WKWebView, React and WASM smoke
        if: needs.tested.outputs.run == ''
        run: |
          profile=$(mktemp -d)
          trap 'rm -rf "$profile"' EXIT
          OPSIS_DATA_DIR="$profile" OPSIS_SPEECH=off "$OPSIS_QA_DESKTOP_BINARY" --smoke-test
      - name: Archive the tested app and WASM for isolated browser shards
        if: needs.tested.outputs.run == ''
        # Tar preserves the executable mode and bundle structure across artifact transport.
        run: tar -cf output/desktop/qa-app.tar output/desktop/Opsis.app packages/engine/pkg
      - name: Upload browser test app
        if: needs.tested.outputs.run == ''
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-qa-app
          path: output/desktop/qa-app.tar
          # A build rerun replaces only this generated test app. Browser-only reruns
          # can still download the latest app from this same workflow run.
          overwrite: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Package desktop release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm desktop:package
      - name: Verify packaged application
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          ditto -x -k output/desktop-release/*.zip "$stage"
          app=$(find "$stage" -name Opsis.app -type d -maxdepth 2)
          codesign --verify --strict "$app"
          OPSIS_DATA_DIR="$stage/profile" OPSIS_SPEECH=off "$app/Contents/MacOS/opsis" --diagnose
      - name: Upload desktop release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-desktop-release
          path: output/desktop-release/
          if-no-files-found: error
          compression-level: 0

  macos-browser:
    name: macOS browser (${{ matrix.arch }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [tested, macos-build]
    if: ${{ !cancelled() && needs.tested.result != 'failure' && needs.macos-build.result == 'success' && needs.tested.outputs.run == '' && (github.event_name != 'pull_request' || github.head_ref != 'development') }}
    strategy:
      fail-fast: false
      matrix:
        # Fit the standard five-macOS-job limit; Intel's slower suite gets more shards.
        include:
          - runner: macos-15-intel
            arch: x64
            shard: 1
            shards: 3
          - runner: macos-15-intel
            arch: x64
            shard: 2
            shards: 3
          - runner: macos-15-intel
            arch: x64
            shard: 3
            shards: 3
          - runner: macos-15
            arch: arm64
            shard: 1
            shards: 2
          - runner: macos-15
            arch: arm64
            shard: 2
            shards: 2
    runs-on: ${{ matrix.runner }}
    env:
      OPSIS_QA_DESKTOP_BINARY: output/desktop/Opsis.app/Contents/MacOS/opsis
    steps:
      - uses: actions/checkout@v4
      - name: Set up browser tools
        uses: ./.github/actions/setup-build-tools
        with:
          rust: 'false'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Download this run's built app and WASM
        uses: actions/download-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-qa-app
          path: output/desktop
      - name: Restore executable permissions and WASM
        run: tar -xf output/desktop/qa-app.tar
      - name: Install browser
        run: pnpm exec playwright install chromium
      - name: Browser feature parity against Go API
        # Each job has its own checkout, API process, temporary SQLite profile and Vite
        # server. Keep one worker inside each shard; never share the in-memory API.
        run: pnpm test:browser --shard=${{ matrix.shard }}/${{ matrix.shards }}
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-browser-failures-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  macos-desktop:
    # Preserve the exact branch-protection names; no successful build can mask a failed
    # native check or browser shard. The main release still waits for these final gates.
    name: macOS desktop (${{ matrix.arch }})
    needs: [tested, macos-native, macos-build, macos-browser]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.head_ref != 'development') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Require every macOS check or an exact tested-tree promotion
        env:
          TESTED_RUN: ${{ needs.tested.outputs.run }}
          BUILD_RESULT: ${{ needs.macos-build.result }}
          NATIVE_RESULT: ${{ needs.macos-native.result }}
          BROWSER_RESULT: ${{ needs.macos-browser.result }}
        run: |
          test "$BUILD_RESULT" = success
          if [ -n "$TESTED_RUN" ]; then
            test "$NATIVE_RESULT" = skipped
            test "$BROWSER_RESULT" = skipped
          else
            test "$NATIVE_RESULT" = success
            test "$BROWSER_RESULT" = success
          fi

  release:
    name: Publish desktop and developer prerelease
    needs: [check, desktop, windows-desktop, macos-desktop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: windows-desktop-release
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*-desktop-release
          merge-multiple: true
          path: release
      - name: Publish release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "Release already published: $RELEASE_TAG"
            exit 0
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$RELEASE_COMMIT" \
              --title "Opsis $RELEASE_VERSION" \
              --draft --prerelease --latest=false --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false

  release-retention:
    name: Keep the 5 newest releases
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release-retention.yml
    with:
      keep: 5
