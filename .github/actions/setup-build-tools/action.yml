name: Set up build tools
description: Install the shared JavaScript and WASM toolchains, with Go for desktop jobs.

inputs:
  desktop:
    description: Install the Go toolchain for the native desktop host.
    default: 'false'
  rust-components:
    description: Additional Rust components required by the job.
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - uses: actions/setup-go@v5
      if: inputs.desktop == 'true'
      with:
        go-version-file: apps/desktop/go.mod
        cache-dependency-path: apps/desktop/go.sum
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: '1.89.0'
        targets: wasm32-unknown-unknown
        components: ${{ inputs.rust-components }}
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: packages/engine
